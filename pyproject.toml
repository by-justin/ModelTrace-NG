[project]
name = "modeltrace-pipeline"
version = "2.0.0"
description = "Offline pipeline: collect reference answers, build the ModelTrace fingerprint bank"
requires-python = ">=3.12"
dependencies = [
    "flatbuffers>=25.9",
    "numpy>=2.1,<3",
    "scikit-learn>=1.6,<2",
]

[tool.uv]
package = false   # run as `uv run python -m pipeline.<module>` from the repository root

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["pipeline/mtfb"]   # generated by flatc

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
]
ignore = [
    "RUF001",   # the prompt suite contains Chinese punctuation on purpose
]

[tool.ruff.lint.per-file-ignores]
# Prompt text must stay byte-for-byte identical to what the reference answers were collected with.
"pipeline/suite.py" = ["E501"]
