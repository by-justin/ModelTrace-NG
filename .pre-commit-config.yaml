# Installed automatically by `nix develop`; run everything with `mt check`.
# Go, Python and web hooks use the tools from the Nix dev shell (language: system), so the
# versions match flake.lock instead of a second set of pins here.
exclude: ^(pipeline/mtfb|core/internal/mtfb|web/src/core/fb)/   # generated by flatc

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^data/
      - id: end-of-file-fixer
        exclude: ^data/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^data/
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]   # pnpm-lock.yaml is multi-document
      - id: check-toml
      - id: check-json
        exclude: ^web/tsconfig\.json$   # tsconfig allows comments
      - id: check-added-large-files
        args: [--maxkb=4096]
      - id: detect-private-key

  - repo: local
    hooks:
      # ---- Python (uv + ruff) ----
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      # ---- Go (core/ and backend/ are separate modules) ----
      - id: goimports
        name: goimports
        entry: goimports -w
        language: system
        types: [go]
      - id: go-mod-tidy
        name: go mod tidy
        entry: bash -c 'for m in core backend; do (cd "$m" && go mod tidy -diff) || exit 1; done'
        language: system
        files: (\.go|go\.mod|go\.sum)$
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: bash -c 'for m in core backend; do (cd "$m" && go vet ./...) || exit 1; done'
        language: system
        types: [go]
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'for m in core backend; do (cd "$m" && golangci-lint run --config ../.golangci.yml ./...) || exit 1; done'
        language: system
        types: [go]
        pass_filenames: false

      # ---- Web ----
      - id: web-typecheck
        name: web typecheck (tsc)
        entry: bash -c 'cd web && pnpm exec tsc -b'
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false
