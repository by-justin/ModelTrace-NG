name: CI

# Every step runs inside the Nix dev shell (flake.nix), so CI uses exactly the local toolchain.
# Pushes to main also deploy the static site to GitHub Pages.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Warm the dev shell
        run: nix develop -c true
      - name: Pre-commit hooks (Go, Python, web, hygiene)
        run: nix develop -c mt check
      - name: Tests (Go core and API, WebAssembly golden check, web)
        run: nix develop -c mt test
      - name: Golden cases match the committed bank
        run: nix develop -c uv run python -m pipeline.golden --check
      - name: Build the static site
        run: nix develop -c mt site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
