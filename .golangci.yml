version: "2"

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G304   # reading the bank and test fixtures from configured paths is intended
  exclusions:
    generated: lax         # skips the flatc output in core/internal/mtfb
    presets:
      - comments
      - std-error-handling
    rules:
      # TinyGo entry points: exported with //export (invisible to the standard toolchain) and
      # trading pointers and int32 across the WebAssembly boundary by design.
      - path: cmd/wasm/
        linters: [unused, gosec]

formatters:
  enable:
    - gofmt
    - goimports
