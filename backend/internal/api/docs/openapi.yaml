openapi: 3.1.0
info:
  title: ModelTrace API
  version: "1"
  description: |
    Guess which language model wrote a set of "random number" replies, and contribute stamped
    samples. Stateless; JSON in and out; errors are RFC 9457 problem documents.
    Get challenge prompts from the web app or pipeline/suite.py: ask the model for ~300 integers
    between 1 and 355 and send its full reply.
paths:
  /v1/health:
    get:
      summary: Liveness and bank version
      responses:
        "200": {description: OK, content: {application/json: {example: {status: ok, bank_version: "2026.11.19", models: 54}}}}
  /v1/models:
    get:
      summary: Models and families in the bank, with source and accuracy
      responses:
        "200": {description: OK}
  /v1/categorize:
    post:
      summary: Score replies. Public, stores nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replies]
              properties:
                replies:
                  type: array
                  minItems: 1
                  maxItems: 10
                  description: Three replies to three different challenges give the most reliable verdict.
                  items:
                    type: object
                    required: [text, expected_count]
                    properties:
                      text: {type: string, description: The model's full reply, unedited.}
                      expected_count: {type: integer, description: How many numbers the challenge asked for.}
      responses:
        "200":
          description: Verdict
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank_version: {type: string}
                  used: {type: integer, description: Replies with enough numbers to count.}
                  tier:
                    type: string
                    enum: [none, match, family, uncertain, unknown]
                    description: |
                      match: one model (or merge group) clearly fits. family: the vendor is clear, the version
                      is not (or the closest model fits weakly). uncertain: neither is clear. unknown: weak fit
                      and no clear vendor. none: no reply had enough numbers.
                  model: {$ref: "#/components/schemas/Candidate"}
                  family: {$ref: "#/components/schemas/FamilyProb"}
                  known: {type: number, description: Similarity to the closest model.}
                  low_fit: {type: boolean, description: The closest model fits worse than ~99% of genuine answers.}
                  candidates: {type: array, items: {$ref: "#/components/schemas/Candidate"}, description: Top 5 models.}
                  families: {type: array, items: {$ref: "#/components/schemas/FamilyProb"}}
                  diagnostics:
                    type: array
                    items:
                      type: object
                      properties:
                        parsed: {type: integer}
                        minimum: {type: integer}
                        accepted: {type: boolean}
                        top: {type: integer, description: Best model index for this reply alone, -1 if not accepted.}
        "400": {$ref: "#/components/responses/Problem"}
        "429": {description: Busy; retry after the Retry-After header., content: {application/problem+json: {}}}
  /v1/stamp:
    get:
      summary: Proof-of-work challenge bound to a request body (ALTCHA)
      parameters:
        - {name: h, in: query, required: true, description: Lowercase hex SHA-256 of the exact body you will POST to /v1/submissions., schema: {type: string, pattern: "^[0-9a-f]{64}$"}}
      responses:
        "200": {description: "ALTCHA challenge {algorithm, challenge, maxNumber, salt, signature}; solve with any ALTCHA library."}
        "400": {$ref: "#/components/responses/Problem"}
  /v1/submissions:
    post:
      summary: Contribute a stamped sample
      description: |
        Send the same bytes you hashed for /v1/stamp, with the solved challenge as a base64 JSON
        ALTCHA payload in the Altcha header. A stamp works once and expires after 10 minutes.
        The server records the body plus request metadata (IP address, user agent and similar headers).
      parameters:
        - {name: Altcha, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Free-form JSON. The web app sends schema "modeltrace-submission/1" (see web/src/api/submit.ts).
      responses:
        "202": {description: Stored, content: {application/json: {example: {id: 3f1c2a4e-0d5b-4c41-9a0e-1f2b3c4d5e6f}}}}
        "400": {$ref: "#/components/responses/Problem"}
        "409": {description: Stamp already used., content: {application/problem+json: {}}}
components:
  schemas:
    Candidate:
      type: object
      properties: {id: {type: string}, display_name: {type: string}, family: {type: string}, probability: {type: number}}
    FamilyProb:
      type: object
      properties: {id: {type: string}, name: {type: string}, probability: {type: number}}
  responses:
    Problem:
      description: Problem document
      content:
        application/problem+json:
          example: {type: about:blank, title: Bad Request, status: 400, detail: "send between 1 and 10 replies"}
